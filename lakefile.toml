name = "KolmogorovArnold"
version = "1.0.0"
keywords = ["math", "mathlib"]
defaultTargets = ["KolmogorovArnold"]

[leanOptions]
pp.unicode.fun = true
# Same reasoning as the parent repository: a mistyped identifier must not silently become
# a fresh universally quantified variable and change a statement.
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
# The same Mathlib as `lean-misc-math`, which publishes these modules, so that the two copies
# build against one Mathlib.
rev = "v4.33.0"

[[lean_lib]]
name = "KolmogorovArnold"
globs = ["KolmogorovArnold.*"]

# The statement surface: the three theorems as fixed before the proof was built, importing only
# Mathlib, with the one that carries the content left `sorry`. Deliberately *not* in
# `defaultTargets` and outside the `KolmogorovArnold.*` glob, so that `lake build`, the audit and
# the three checks cover the library alone and stay meaningful. The statements are proved,
# unchanged, in `KolmogorovArnold/Theorem.lean`. Build this explicitly with `lake build Target`.
[[lean_lib]]
name = "Target"
roots = ["Target.Roof"]

# Guards `Target/Roof.lean` against drifting from the library: ascribes each Target statement to
# the theorem `KolmogorovArnold/Theorem.lean` proves. Contains no `sorry` -- it asserts the real
# theorems -- but stays outside the audited glob and `defaultTargets`, like the Target itself.
# Build it with `lake build TargetTypeCheck`.
[[lean_lib]]
name = "TargetTypeCheck"
roots = ["Target.TypeCheck"]
