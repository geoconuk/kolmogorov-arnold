name = "KolmogorovArnold"
version = "0.1.0-dev"
keywords = ["math", "mathlib"]
defaultTargets = ["KolmogorovArnold"]

[leanOptions]
pp.unicode.fun = true
# Same reasoning as the parent repository: a mistyped identifier must not silently become
# a fresh universally quantified variable and change a statement.
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
# Held at the parent repository's pin for now, so the warm Mathlib cache is reusable and
# imported modules need no repinning. Bump to current Mathlib before any Lean Pool handover
# -- the pool asks for a warm build against latest, and nothing here needs Palomar's
# ancestor-of-master constraint.
rev = "v4.33.0"

[[lean_lib]]
name = "KolmogorovArnold"
globs = ["KolmogorovArnold.*"]

# The statement surface: the theorems this development exists to prove, with the one that
# carries the content stated `sorry`. Deliberately *not* in `defaultTargets` and outside the
# `KolmogorovArnold.*` glob -- the same arrangement `lean-misc-math` uses for a Palomar
# Challenge -- so that `lake build`, the audit and the three checks stay green and meaningful
# while the layers are built. Build it explicitly with `lake build Target`. When Layer 6
# closes the `sorry` the statements move into the library and this file becomes the Challenge.
[[lean_lib]]
name = "Target"
roots = ["Target.Roof"]
